<style>

    text-align: center;
    margin: 20px;
    background: #f5f5f5;
}

h1 {
    font-size: 1.8em;
}

input[type="date"] {
    font-size: 1.2em;
    padding: 10px;
    margin: 20px 0;
}

.container {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    width: 300px;
    min-height: 180px;
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.card h2 {
    margin-top: 0;
}

.keyword {
    font-size: 3em;
    font-weight: bold;
    color: #0078d4;
    margin-top: 15px;
}

.none {
    color: #999;
}
</style>
</head>
